services:
  postgres:
    image: postgres:16-alpine
    container_name: orders-console-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders_console
      POSTGRES_USER: orders_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - orders_console_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_app -d orders_console"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orders_console_data:
